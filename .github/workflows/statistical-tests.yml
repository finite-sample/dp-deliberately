name: Statistical validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: soodoku/distortions
          ref: ffd7aafb017c039726d95d61e90f13ca4521e317
          path: artifacts/source
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: local::.
      - name: Verify source results
        run: Rscript inst/examples/verify-distortions.R artifacts/source
      - name: Install optional bootstrap backend
        shell: Rscript {0}
        run: |
          install.packages("fwildclusterboot",
            repos = c("https://s3alfisc.r-universe.dev", "https://cloud.r-project.org"))
      - name: Run bootstrap sensitivity
        run: Rscript inst/examples/wild-bootstrap.R
